# Screenshots come back as the "ios-tour" artifact.
# The app tester on a GitHub macOS runner: installs an EAS simulator build (profile e2e-test) on an
# iPhone simulator, walks through every screen with Maestro (.maestro/tour.yaml) and keeps the screenshots.
# Run: gh workflow run ios-tester.yml -f app_url=<EAS build artifact .tar.gz>
name: iOS tester

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: EAS simulator build (.tar.gz)
        required: true

jobs:
  tour:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # actions pinned to a commit (a tag can be moved), the version in the comment
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # a fixed Maestro release, checked against its published SHA-256 before it is unpacked
      # (no script piped from the internet into a shell)
      - name: Install Maestro
        env:
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip" -o maestro.zip
          echo "$MAESTRO_SHA256  maestro.zip" | shasum -a 256 -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Get the app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          mkdir -p build && curl -fsSL "$APP_URL" -o app.tar.gz && tar -xzf app.tar.gz -C build
          echo "APP=$(find build -maxdepth 3 -name '*.app' | head -1)" >> "$GITHUB_ENV"

      - name: Boot an iPhone and install
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # a fresh simulator covers the app with the swipe-typing intro the first time a field focuses
          # (the wish sheet), and Maestro then sees only the screen underneath: mark it as already shown
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences KeyboardContinuousPathEnabled -bool false
          xcrun simctl install "$UDID" "$APP"

      - name: Walk through the app
        run: |
          mkdir -p shots
          cd shots && maestro --device "$UDID" test ../.maestro/tour.yaml --test-output-dir=../maestro-out || echo "TOUR_FAILED=1" >> "$GITHUB_ENV"

      - name: Keep the app log
        if: always()
        run: xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "KrakowLoop" OR eventMessage CONTAINS "ReactNative"' > maestro-out/device.log 2>&1 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-tour
          path: |
            shots
            maestro-out

      - name: Fail when the tour failed
        if: env.TOUR_FAILED == '1'
        run: exit 1
