# The tester's walk through KrakowLoop on an iOS simulator (scripts/ios-tour.sh, .github/workflows/ios-tester.yml).
# Every screen a traveller sees gets a screenshot, and the features that matter are asserted on the way.
# Deep links: iOS asks "Open in KrakowLoop?" each time, so every openLink is followed by a tap on "Open".
appId: com.krakowloop.app
name: KrakowLoop tour
---
- setLocation:
    latitude: 50.0617
    longitude: 19.9373
- launchApp:
    clearState: true
    permissions:
      location: inuse
- extendedWaitUntil:
    visible: "Skip"
    timeout: 30000
    optional: true
- takeScreenshot: 01_welcome
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 02_now
- scroll
- takeScreenshot: 03_now_scrolled

# Discover: the sight tiles once were an empty gap on iOS
- tapOn: "Discover"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 10_discover_top
- scrollUntilVisible:
    element: "Sights to walk to"
    direction: DOWN
    optional: true
- takeScreenshot: 11_discover_sights
- assertVisible: "Cloth Hall"
- swipe:
    direction: UP
- takeScreenshot: 12_discover_more
- swipe:
    direction: UP
- takeScreenshot: 13_discover_more2
- swipe:
    direction: UP
- takeScreenshot: 14_discover_bottom

# a wish, from one of the examples: the map opens on what it understood
- openLink: "krakowloop://wish"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 15_wish_sheet
- tapOn: "Sushi, open now"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 16_wish_map

# food filters from a shared link, the list raised
- openLink: "krakowloop://map?mode=eat&open=1&veg=1&sort=name"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 20_map_link
- tapOn:
    text: "Show more of the list"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 21_map_list
# the chosen order is named over the list ("A–Z" itself sits off screen in the sort row)
- assertVisible: "Found: .* · A–Z"

# two places side by side
- tapOn:
    text: "Compare .*"
    index: 0
- assertVisible: "Pick one more place to compare"
- tapOn:
    text: "Compare .*"
    index: 1
- takeScreenshot: 22_compare_picked
- tapOn: "Compare"
- waitForAnimationToEnd
- takeScreenshot: 23_compare_sheet
- assertVisible: "Side by side"
- tapOn: "Close the comparison"
- waitForAnimationToEnd

# the filters sent as a link: the system share sheet
- tapOn: "Share these food filters as a link"
- waitForAnimationToEnd
- takeScreenshot: 24_share_sheet
# the iOS share sheet has no close button: a tap on the dimmed screen above it closes it
- tapOn:
    point: "50%, 20%"
- waitForAnimationToEnd
- assertNotVisible: "Reminders"

# a place page and the heart
- openLink: "krakowloop://place/czartoryski"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 30_place
- tapOn: "Save .* for later"
- assertVisible: "Remove .* from saved"
- scroll
- takeScreenshot: 31_place_scrolled

# the saved place waits in Discover
- openLink: "krakowloop://discover"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "For later"
    direction: DOWN
- takeScreenshot: 32_discover_saved
- assertVisible: "Saved · 1"

# the plan: two days, the rail, a visited stop
- openLink: "krakowloop://plan"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 40_plan_start
- tapOn: "2 days"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 41_plan_day
- scroll
- takeScreenshot: 42_plan_rail
- tapOn:
    text: "Been to .*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: 43_plan_visited
- scrollUntilVisible:
    element: "Visited 1 of .*"
    direction: UP
- takeScreenshot: 44_plan_progress
- scroll
- scroll
- takeScreenshot: 45_plan_end

# Time Lens
- openLink: "krakowloop://obiektyw"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 50_lens
