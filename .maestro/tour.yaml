# The tester's walk through KrakowLoop on an iOS simulator (EAS Workflows, .eas/workflows/ios-tester.yml).
# Every screen a traveller sees gets a screenshot: they come back in the "Maestro Test Results" artifact.
appId: com.krakowloop.app
name: KrakowLoop tour
---
- setLocation:
    latitude: 50.0617
    longitude: 19.9373
- launchApp:
    clearState: true
    permissions:
      location: inuse
- extendedWaitUntil:
    visible: "Skip"
    timeout: 30000
    optional: true
- takeScreenshot: 01_welcome
- tapOn:
    text: "Skip"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 02_now
- scroll
- takeScreenshot: 03_now_scrolled

# Discover: the screen that shows nothing under "Sights to walk to" on the iPhone
- tapOn: "Discover"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 10_discover_top
- scrollUntilVisible:
    element: "Sights to walk to"
    direction: DOWN
    optional: true
- takeScreenshot: 11_discover_sights
- swipe:
    direction: UP
- takeScreenshot: 12_discover_more
- swipe:
    direction: UP
- takeScreenshot: 13_discover_more2
- swipe:
    direction: UP
- takeScreenshot: 14_discover_bottom

# the map in the eat mode: filters, comparing
- openLink: "krakowloop://map?mode=eat"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 20_map_eat

# a place page and the heart
- openLink: "krakowloop://place/czartoryski"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 30_place
- tapOn:
    text: "Save .* for later"
    optional: true
- scroll
- takeScreenshot: 31_place_scrolled

# the plan: two days, then the rail
- openLink: "krakowloop://plan"
- waitForAnimationToEnd
- takeScreenshot: 40_plan_start
- tapOn:
    text: "2"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 41_plan_day
- scroll
- takeScreenshot: 42_plan_rail

# Time Lens
- tapOn: "Time Lens"
- waitForAnimationToEnd
- takeScreenshot: 50_lens
